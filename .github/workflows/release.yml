name: Release

# Compila PyInstaller GUI para cada sistema y, al subir un tag v*, publica la release.
# Artefactos: PyInstallerGUI-<versión>-<sistema>-<arq>-<variante>.<ext> + SHA256SUMS.txt
#   - Manual (solo compila y deja los paquetes como artifacts): Actions → Release → Run workflow
#   - Publicar: git tag v5.0.0 && git push origin v5.0.0
on:
  workflow_dispatch:
  push:
    tags: ["v*"]

jobs:
  windows:
    name: ${{ matrix.label }}
    runs-on: windows-latest
    strategy:
      fail-fast: false
      matrix:
        include:
          # Windows 10/11 — Qt 6 (PySide6): solo existe para 64 bits
          - label: win-x64
            python: "3.12"
            arch: x64
          # Windows 7/8 — Python 3.8 + Qt 5 (PySide2): última combinación que corre en Windows 7/8
          - label: win7-x64
            python: "3.8"
            arch: x64
          # 32 bits: Qt 6 no tiene versión x86, así que este paquete (PySide2) cubre Windows 7, 8, 10 y 11
          - label: win7-x86
            python: "3.8"
            arch: x86
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python }}
          architecture: ${{ matrix.arch }}

      - name: Instalar dependencias
        run: |
          python -m pip install --upgrade pip
          python -m pip install -r requirements.txt pyinstaller

      - name: Inno Setup
        shell: pwsh
        run: |
          if (-not (Test-Path "C:\Program Files (x86)\Inno Setup 6\ISCC.exe")) {
            choco install innosetup -y --no-progress
          }

      - name: Compilar, probar y empaquetar
        run: python release/build_release.py --label ${{ matrix.label }}

      - uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.label }}
          path: release_out/*
          if-no-files-found: error

  linux:
    name: linux-x86_64
    # Ubuntu 22.04: glibc más vieja → el binario corre en más distribuciones
    runs-on: ubuntu-22.04
    env:
      APPIMAGE_EXTRACT_AND_RUN: "1"   # appimagetool sin FUSE en el runner
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Librerías de sistema y appimagetool
        run: |
          sudo apt-get update
          sudo apt-get install -y libegl1 libgl1 libxkbcommon0 libxkbcommon-x11-0 libxcb-cursor0 \
                                  libfontconfig1 libdbus-1-3 file
          sudo wget -q -O /usr/local/bin/appimagetool \
            https://github.com/AppImage/appimagetool/releases/download/continuous/appimagetool-x86_64.AppImage
          sudo chmod +x /usr/local/bin/appimagetool

      - name: Instalar dependencias
        run: |
          python -m pip install --upgrade pip
          python -m pip install -r requirements.txt pyinstaller

      - name: Compilar, probar y empaquetar
        run: python release/build_release.py --label linux-x86_64

      - uses: actions/upload-artifact@v4
        with:
          name: linux-x86_64
          path: release_out/*
          if-no-files-found: error

  publish:
    name: Publicar release
    if: startsWith(github.ref, 'refs/tags/v')
    needs: [windows, linux]
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4

      - name: El tag coincide con la versión del código
        run: |
          code=$(python -c "import sys; sys.path.insert(0, '.'); from pyinstaller_gui import APP_VERSION; print(APP_VERSION.lstrip('vV'))")
          tag="${GITHUB_REF_NAME#v}"
          echo "código=$code tag=$tag"
          test "$code" = "$tag"

      - uses: actions/download-artifact@v4
        with:
          path: assets
          merge-multiple: true

      - name: Checksums SHA256
        working-directory: assets
        run: sha256sum * > SHA256SUMS.txt && cat SHA256SUMS.txt

      # CLI oficial de GitHub (sin acciones de terceros con permiso de escritura)
      - name: Crear la release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release create "$GITHUB_REF_NAME" assets/* \
            --title "PyInstaller GUI - PRO Builder $GITHUB_REF_NAME" \
            --notes-file release/NOTES.md \
            --verify-tag
